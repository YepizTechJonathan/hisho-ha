# Runs on Forgejo (Kihon), on Hashira Ren, woken if parked: Kihon copies every push from GitHub to
# hisho/hisho-ha every few minutes (hisho deploy/forgejo/ha_repos.py). GitHub runs no Actions here.
name: Validate

on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # HA's own rules move; this catches it between pushes

jobs:
  hassfest:
    runs-on: ren
    container:
      image: ghcr.io/home-assistant/hassfest:latest
      env:
        # Every Ren job gets the GPU (CDI); its ldcache hook leaves musl (alpine) without /usr/local/lib.
        LD_LIBRARY_PATH: /usr/local/lib:/usr/lib:/lib
    timeout-minutes: 10
    steps:
      - name: git and node for checkout (the image has neither)
        run: apk add --no-cache -q git nodejs
      - uses: actions/checkout@v4
      - name: hassfest
        run: /usr/src/homeassistant/script/hassfest/docker/entrypoint.sh

  tests:
    runs-on: ren
    container:
      image: python:3.14-trixie
    timeout-minutes: 20
    steps:
      - name: node for checkout
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends nodejs >/dev/null
      - uses: actions/checkout@v4
      - run: pip install -q -r requirements_test.txt
      - run: pytest -q -p no:cacheprovider
