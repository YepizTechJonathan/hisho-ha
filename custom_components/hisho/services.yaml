run_action:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    action:
      required: true
      example: machine.wake
      selector:
        text:
    target:
      example: hashira-ren
      selector:
        text:
    args:
      selector:
        object:
    confirm:
      default: false
      selector:
        boolean:
alert:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    alert_id:
      required: true
      selector:
        text:
    verb:
      required: true
      selector:
        select:
          translation_key: alert_verb
          options: [ack, unack, snooze, notify, investigate]
    hours:
      default: 1
      selector:
        number:
          min: 0.1
          max: 168
          step: 0.5
          unit_of_measurement: h
maintenance:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    target:
      required: true
      example: hashira-ren
      selector:
        text:
    mode:
      required: true
      selector:
        select:
          translation_key: maintenance_mode
          options: ["on", "off"]
    reason:
      selector:
        text:
    duration:
      example: 2h
      selector:
        text:
    keep_vms:
      default: false
      selector:
        boolean:
    park:
      default: false
      selector:
        boolean:
job:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    job_id:
      required: true
      selector:
        text:
    verb:
      required: true
      selector:
        select:
          translation_key: job_verb
          options: [cancel, retry, clear, dispatch, resume]
create_job:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    kind:
      required: true
      example: transcribe
      selector:
        text:
    worker:
      selector:
        text:
    meta:
      selector:
        object:
ask:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: hisho
    text:
      required: true
      example: What needs me today?
      selector:
        text:
          multiline: true
    conversation_id:
      selector:
        text:
